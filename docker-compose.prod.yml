services:
  affiliate-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: affiliate-studio-prod
    restart: unless-stopped
    ports:
      - "3400:3400"
    env_file:
      - .env
    environment:
      - PORT=3400
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3400/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
